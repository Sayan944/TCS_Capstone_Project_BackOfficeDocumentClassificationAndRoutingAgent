[project]
name = "document-classification-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sayan Halder", email = "haldersayan649@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "google-genai>=2.23.0",
    "groq>=1.7.0",
    "openai>=3.14.0",
    "pypdf>=6.18.1",
    "python-docx>=1.2.0",
